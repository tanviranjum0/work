# RideBack edge: TLS termination, HTTP->HTTPS redirect, ACME challenges, Socket.IO upgrades.
#
# Certbot issues the certificate under the fixed name "api", so this file has no per-domain
# values: /etc/letsencrypt/live/api/{fullchain,privkey}.pem.
#
# Note: a location that sets any proxy_set_header inherits none from the server block,
# so each proxied location lists the full header set.

# Docker's embedded DNS. "resolve" (nginx >= 1.27.3) re-resolves "api" when the container
# is recreated on deploy, instead of pinning the IP seen at startup.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream rideback_api {
    zone rideback_api 64k;
    server api:4000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Coarse per-IP shields in front of the app's own Redis-backed limiters. Kept generous
# because mobile carriers put many riders behind one CGNAT address.
limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server_tokens off;

server {
    listen 80 default_server;
    server_name api.rideshare.tanvirdev.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name api.rideshare.tanvirdev.site;

    ssl_certificate     /etc/letsencrypt/live/api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Express caps JSON bodies at 16 KB; drop oversized or slow bodies before they reach Node.
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    proxy_http_version 1.1;

    location /socket.io/ {
        limit_conn conn_per_ip 50;
        proxy_pass http://rideback_api;
        proxy_set_header Host              $host;
        # Overwrite rather than append: clients can't spoof their IP, and Express trusts one hop.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        # Must exceed Socket.IO pingInterval + pingTimeout (25s + 20s).
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        limit_req zone=req_per_ip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://rideback_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        # Empty Connection header enables upstream keepalive.
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }
}
