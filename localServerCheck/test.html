<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <style>
      .container {
        width: 800px;
        position: relative;
        overflow: hidden;
        border: 2px solid black;
      }
      .slider {
        display: flex;
      }
      .slide {
        flex: 0 0 100%;
        height: 400px;
        background-size: cover;
        background-position: center;
      }
      .slide.active {
        transform: translateX(0);
      }
      .slider-control {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translate(-50%);
      }
      .prev-slide,
      .next-slide {
        margin: 0 10px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="slider">
        <div class="slide active" style="background: url(sc3.png)"></div>
        <div class="slide" style="background: url(sc1.png)"></div>
        <div class="slide" style="background: url(sc4.png)"></div>
      </div>
      <div class="slider-control">
        <button class="prev-slide">Prev</button>
        <button class="next-slide">Next</button>
      </div>
    </div>
  </body>
  <script>
    var slider = document.querySelector(".slider");
    var slide = document.querySelectorAll(".slide");
    var prevbtn = document.querySelector(".prev-slide");
    var nextbtn = document.querySelector(".next-slide");
    let slideIndex = 0;
    slide[slideIndex].classList.add("active");
    prevbtn.addEventListener("click", function () {});
    nextbtn.addEventListener("click", function () {
      slide[slideIndex].classList.remove("active");
      slideIndex = slideIndex === slide.length - 1 ? 0 : slideIndex + 1;
      slide[slideIndex].classList.add("active");
      slide.style.transform = `translateX(-${slideIndex * 100})`;
    });
  </script>
</html>
